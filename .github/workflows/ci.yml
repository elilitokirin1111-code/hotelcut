name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://hotelcut:hotelcut_local@localhost:5432/hotelcut

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotelcut
          POSTGRES_PASSWORD: hotelcut_local
          POSTGRES_USER: hotelcut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelcut -d hotelcut"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/analysis-worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -e "apps/analysis-worker[dev]"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Migrate an empty database
        run: pnpm db:migrate

      - name: Load fictional development seed
        run: pnpm db:seed

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
